[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loganalyser"
version = "0.1.0"
description = "AI-powered security log analyser (learning prototype, synthetic data only)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.30",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
